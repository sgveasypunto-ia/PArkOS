[project]
name = "api-admin"
version = "0.1.0"
description = "Parkos cloud admin API — multi-tenant FastAPI entrypoint (operador + admin + sync)."
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "parkos-core",
]

[tool.uv.sources]
parkos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_admin_main"]