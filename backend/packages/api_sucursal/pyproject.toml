[project]
name = "api-sucursal"
version = "0.1.0"
description = "Parkos branch API — branch-pinned FastAPI entrypoint (operador + sync only)."
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "parkos-core",
]

[tool.uv.sources]
parkos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_sucursal_main"]