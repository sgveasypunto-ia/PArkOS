[project]
name = "parkos-core"
version = "0.1.0"
description = "Parkos shared core library — SQLAlchemy 2.0 models, Pydantic schemas, RBAC, sync, and Alembic migrations."
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    # ORM + async driver
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg[binary]>=3",
    "psycopg2-binary",
    # Migrations
    "alembic",
    # Validation + settings
    "pydantic>=2",
    "pydantic-settings",
    "pydantic[email]>=2",
    # Auth (3-issuer JWT + bcrypt)
    "python-jose[cryptography]",
    "bcrypt",
    "passlib[bcrypt]",
    # Logging
    "structlog",
    # DIAN HTTP transport (T-PR11-07, design §21.11) — runtime deps,
    # not just dev: cloud image must ship them so dispatcher imports
    # work without the dev workspace. lxml is for the UBL XML
    # serializer (T-PR11-03, design §21.11); httpx for the Factus
    # provider adapter (T-PR11-04).
    "httpx>=0.27",
    "lxml>=5.0",
    # Observability (T-PR12-008, design §3/§9) — counters + gauges for the
    # sync pipeline (catalog_backfill_complete first; the rest land in PR13).
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkos_core"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-select = ["I", "UP", "B", "ASYNC", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]
# HU-F1.4 extends ``api/v1/empresa.py`` with a dedicated handler that
# uses FastAPI's ``Query(...)`` / ``Depends(...)`` defaults (B008).
# Same convention as the existing auth.py / catalogos.py ignores.
"src/parkos_core/api/v1/empresa.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["factory.*", "faker.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]