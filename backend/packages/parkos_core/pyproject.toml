[project]
name = "parkos-core"
version = "0.1.0"
description = "Parkos shared core library — SQLAlchemy 2.0 models, Pydantic schemas, RBAC, sync, and Alembic migrations."
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    # ORM + async driver
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg[binary]>=3",
    "psycopg2-binary",
    # Migrations
    "alembic",
    # Validation + settings
    "pydantic>=2",
    "pydantic-settings",
    "pydantic[email]>=2",
    # Auth (3-issuer JWT + bcrypt)
    "python-jose[cryptography]",
    "bcrypt",
    "passlib[bcrypt]",
    # Logging
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkos_core"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-select = ["I", "UP", "B", "ASYNC", "SIM", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["factory.*", "faker.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]