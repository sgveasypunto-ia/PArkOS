# Alembic configuration for parkos-core migrations.
#
# Database URL is supplied by the `DATABASE_URL` env var at runtime
# (consumed in `migrations/env.py`). This file intentionally leaves
# `sqlalchemy.url` empty to prevent committing secrets.

[alembic]
script_location = migrations

# `sqlalchemy.url` is overridden in env.py from the DATABASE_URL env var.
sqlalchemy.url =

# Path where migration files live.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone handling: emit timestamps in UTC.
timezone = UTC

# Database URL is read at runtime from env.
prepend_sys_path = ../src

[post_write_hooks]
# Format and lint migration files after generation.
hooks = ruff_format, ruff_check

ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = console_scripts
ruff_check.entrypoint = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S