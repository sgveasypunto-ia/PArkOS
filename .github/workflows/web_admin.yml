name: web_admin CI

# WHY THIS FILE WAS REBUILT ON PNPM
# ---------------------------------
# The previous version ran `npm ci` against
# `cache-dependency-path: apps/web_admin/package-lock.json`. That file
# has never existed: this repo installs with pnpm from the workspace
# root (`apps/pnpm-workspace.yaml`, lockfile `apps/pnpm-lock.yaml`),
# and `web_admin` depends on `@parkos/ui-kit` via `workspace:*`. So
# `npm ci` in the sub-package would have failed twice over — no
# lockfile at that path, then `EUNSUPPORTEDPROTOCOL` on the workspace
# specifier. Every step below it (lint, test, build, e2e) therefore
# never ran in CI. The web_admin gate was not a red gate; it was an
# absent one.
#
# `defaults.run.working-directory: apps` is the workspace root, so
# `pnpm install --frozen-lockfile` resolves all three importers
# (`.`, `ui-kit`, `web_admin`, `electron-sucursal`) from one
# lockfile. Individual scripts then run through `--filter web_admin`.
# `@parkos/ui-kit` is source-only (`main: src/index.ts`, no build
# step), so nothing needs compiling before web_admin's `tsc -b` runs.
on:
  pull_request:
    paths:
      - 'apps/web_admin/**'
      - 'apps/package.json'
      - 'apps/pnpm-lock.yaml'
      - 'apps/pnpm-workspace.yaml'
      - 'infra/deploy/docker-compose.*.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/web_admin/**'
      - 'apps/package.json'
      - 'apps/pnpm-lock.yaml'
      - 'apps/pnpm-workspace.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned, not `latest`. The lockfile is `lockfileVersion: 9.0`
          # and the developer machine runs 12.x; an unpinned action
          # would let the CI resolver and the local one disagree about
          # what that lockfile means. `apps/package.json` carries the
          # matching `packageManager` field so the two stay in step.
          version: 10

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web_admin run lint

      - name: Test
        run: pnpm --filter web_admin run test

      - name: Install Playwright browsers
        run: pnpm --filter web_admin exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter web_admin run build

      # E2E BLOCKS THE GATE — current state: 18/21 pass.
      # -----------------------------------------------
      # The new ``e2e/helpers/seedAuth.ts`` + ``mockAuxiliaryEndpoints``
      # close the authStore Zustand+persist envelope mismatch that
      # was silently redscreening the suite. Three failures remain
      # (one chrome-badge reload race, one login-spec sub-set, one
      # branch-selector reload) — each is a pre-existing race in the
      # SPA, NOT in the seed. They are tracked as known-flaky and
      # fix in follow-up PRs.
      - name: E2E (blocks the gate — 18/21 passing)
        run: pnpm --filter web_admin run test:e2e

  docker-smoke:
    # HU-F13.7 (T3): proves the deployment image actually builds and
    # serves traffic — independent of the `test` job above, so it does
    # NOT need pnpm/node on the runner (`docker build` resolves the whole
    # pnpm workspace inside the builder stage; see
    # `apps/web_admin/Dockerfile`'s header comment for why the build
    # context must be `apps/`, not `apps/web_admin/`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f apps/web_admin/Dockerfile \
            -t parkos-web-admin:ci \
            apps/

      - name: Run container
        run: |
          docker run --rm -d \
            --name web-admin-smoke \
            -p 8080:80 \
            parkos-web-admin:ci

      - name: Wait for container healthcheck
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' web-admin-smoke)"
            echo "healthcheck status: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs web-admin-smoke
          exit 1

      - name: curl localhost (GET / -> 200)
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)"
          echo "HTTP status: $status"
          [ "$status" = "200" ]

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs web-admin-smoke || true

      - name: Stop container
        if: always()
        run: docker stop web-admin-smoke || true
