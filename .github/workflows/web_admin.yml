name: web_admin CI

on:
  pull_request:
    paths:
      - 'apps/web_admin/**'
      - 'infra/deploy/docker-compose.*.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web_admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e