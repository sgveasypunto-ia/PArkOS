# OpenSpec config — easypunto_parkos
# Generated by sdd-init on 2026-08-30.
# This is a YAML config file (parseable by gentle-ai). The detailed project
# context lives in openspec/PROJECT_CONTEXT.md; testing capabilities live in
# openspec/TESTING_CAPABILITIES.md.

schema: spec-driven

context: |
  Project: easypunto_parkos (parking-lot management system).
  Stack: empty — design phase pending. Assumed stack documented in PROJECT_CONTEXT.md.
  Domain: multi-tenant cloud-edge with per-branch Postgres + bidirectional sync.
  Compliance: DIAN Colombia (5+ year retention, SHA256 hash chain).
  Data model: AUDIT-FIRST (49 tables, 3 enforcement levels [V] / [L-E,W,S] / [A]).
  Artifact store: hybrid (Engram + openspec/). Strict TDD: false (not yet configurable).

rules:
  proposal:
    - Include rollback plan for any change touching audit-first tables.
    - Reference the 49-table AUDIT-FIRST model when proposing schema changes.
    - Mark sync-queue or sync-conflict changes as risk: high (bidirectional sync).
  specs:
    - Use Given/When/Then for every scenario.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - For [A] tables: spec MUST include the REVOKE statement and trigger DDL.
    - For [L-W] tables: spec MUST document the uuid_padre chain contract.
  design:
    - Include sequence diagrams for sync flows (cloud → branch, branch → cloud, conflict resolution).
    - Document every architecture decision with rationale (why, alternatives, trade-offs).
    - For backend module layout, partition models/ by audit level (models/[V]/, models/[L]/, models/[A]/).
  tasks:
    - Group by phase, use hierarchical numbering (1.1, 1.2, 2.1, ...).
    - Keep tasks completable in one session (review budget: 400 lines per change).
    - Mark migration tasks with a pre-flight `alembic upgrade --sql` check.
  apply:
    guidelines:
      - Follow existing code patterns once established.
      - Never edit schema in ORM only — always produce an Alembic migration.
      - DIAN audit-first tables require REVOKE + trigger in the same migration that creates the table.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
    notes: Test runner not yet configured. Re-run sdd-init once pyproject.toml or package.json lands.
  archive:
    - Warn before merging destructive deltas.
    - Archive full audit folder (proposal + specs + design + tasks + verify-report) — never delete.

testing:
  strict_tdd: true
  runner: ""
  layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality:
    linter: false
    type_checker: false
    formatter: false
  reconfigure_when: "pyproject.toml or package.json is added — re-run sdd-init or /sdd-qa-plan."
