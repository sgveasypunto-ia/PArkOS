# OpenSpec config — easypunto_parkos
# Last refreshed by sdd-init on 2026-09-19 (initial 2026-08-30).
# This is a YAML config file (parseable by gentle-ai). The detailed project
# context lives in openspec/PROJECT_CONTEXT.md; testing capabilities live in
# openspec/TESTING_CAPABILITIES.md.
#
# NOTE (2026-09-19): PROJECT_CONTEXT.md and TESTING_CAPABILITIES.md still
# describe the 2026-08-30 empty-project snapshot. They need a follow-up
# refresh — they are NOT auto-regenerated. Until that refresh lands, treat
# this config.yaml as authoritative for stack + testing, and the Engram
# observation `sdd-init/parkos` for the full detection record.

schema: spec-driven

project: parkos

persistence:
  mode: hybrid   # Engram + openspec/; user-ratified 2026-08-30
  engram:
    project_key: parkos
    sources:
      - sdd-init/parkos
      - sdd/parkos/testing-capabilities
      - skill-registry
  openspec:
    root: openspec/

context: |
  Project: easypunto_parkos / Engram key `parkos` (multi-tenant parking-lot management system).
  Stack (detected 2026-09-19, NOT assumed): backend = Python 3.13 + uv workspace + FastAPI + SQLAlchemy 2.0 async + Pydantic v2 + Alembic + bcrypt + python-jose JWT (RS256) + httpx + structlog + prometheus-client; frontend = React 18 + Vite 5 + TypeScript strict + shadcn/ui (Radix) + Tailwind + Zustand + react-hook-form + Zod + i18next + vite-plugin-pwa + axe-core/playwright; kiosk = Electron 30 + React 18 + esbuild + electron-builder + escpos-usb; shared UI = apps/ui-kit (zod + zustand + swr peer).
  Workspaces: backend (uv, packages/parkos_core), apps (pnpm: ui-kit, web_admin, electron-sucursal); 2 Docker images (cloud + branch) selected by BUILD_TARGET/SERVICE_NAME.
  Domain: multi-tenant cloud-edge with per-branch Postgres + bidirectional sync (outbox sync_queue + per-row monotonic seq + SHA256 hash chain).
  Compliance: DIAN Colombia (5+ year retention, hash chain on log_transaccional + revocacion_factura).
  Data model: AUDIT-FIRST (51 ER entities / 54 physical tables, ADR-002; 3 enforcement levels [V] / [L-E,W,S] / [A]).
  Artifact store: hybrid (Engram + openspec/). Strict TDD: true (real pytest+vitest runners, RED-first tests, 80% coverage gate in CI).

rules:
  proposal:
    - Include rollback plan for any change touching audit-first tables.
    - Reference the 51-entity AUDIT-FIRST model (ADR-002) when proposing schema changes.
    - Mark sync-queue or sync-conflict changes as risk: high (bidirectional sync).
  specs:
    - Use Given/When/Then for every scenario.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - For [A] tables: spec MUST include the REVOKE statement and trigger DDL.
    - For [L-W] tables: spec MUST document the uuid_padre chain contract.
  design:
    - Include sequence diagrams for sync flows (cloud → branch, branch → cloud, conflict resolution).
    - Document every architecture decision with rationale (why, alternatives, trade-offs).
    - For backend module layout, partition models/ by audit level (models/[V]/, models/[L]/, models/[A]/).
  tasks:
    - Group by phase, use hierarchical numbering (1.1, 1.2, 2.1, ...).
    - Keep tasks completable in one session (review budget: 400 lines per change).
    - Mark migration tasks with a pre-flight `alembic upgrade --sql` check.
  apply:
    guidelines:
      - Follow existing code patterns once established.
      - Never edit schema in ORM only — always produce an Alembic migration.
      - DIAN audit-first tables require REVOKE + trigger in the same migration that creates the table.
    tdd: true
    test_command: "uv run pytest -q --cov=parkos_core.sync"
  verify:
    test_command: "uv run pytest --cov --cov-report=xml --cov-fail-under=80"
    build_command: "uv run ruff check . && uv run mypy packages/parkos_core/src"
    frontend_test_command: "cd apps/web_admin && npm run lint && npm run test && npm run test:e2e"
    coverage_threshold: 80
    notes: Backend CI runs uv sync (frozen) → sync_queue carve-out guard → catalog drift guard → ruff → mypy → pytest+coverage (80%) → Trivy (merge-to-dev). web_admin CI runs lint → vitest → build → playwright.
  archive:
    - Warn before merging destructive deltas.
    - Archive full audit folder (proposal + specs + design + tasks + verify-report) — never delete.

testing:
  strict_tdd: true
  runner: "uv run pytest (backend) | pnpm vitest + playwright (frontend)"
  layers:
    unit: true
    integration: true
    e2e: true
  coverage: true
  quality:
    linter: true
    type_checker: true
    formatter: true
  reconfigure_when: "Test runner, lint config, or coverage gate changes — re-run sdd-init or /sdd-qa-plan."
