# docker-compose.branch.yml — Parkos branch-side stack.
#
# Spins up one branch: Postgres (with pg_partman), the FastAPI branch
# API, and the branch sync worker. Mirrors the per-branch production
# topology:
#
#   branch-db  ←── api-sucursal
#              └── job_sync_sucursal   (this PR9b)
#
# Per design 21.6 (installability matrix) + tasks.md T-PR9-10:
#   - Every stateful service carries a HEALTHCHECK.
#   - job_sync_sucursal depends on branch-db + api-sucursal with
#     condition: service_healthy so the worker waits for the DB to
#     accept connections before boot.
#   - The worker's long-lived sync-agent JWT is mounted via a named
#     volume (jwt-volume). The entrypoint pairs the branch on first
#     boot, persists the JWT to /var/run/parkos/sync.jwt, and the
#     worker reads it on subsequent boots. Subsequent boots skip the
#     pair step.
#   - deploy.replicas: 1 per branch (paired with api-sucursal).
#   - The branch API exposes 8000 to the LAN so the web_sucursal PWA
#     can reach it; the worker's /healthz on 9999 stays internal.
#
# DIAN boundary (REQ-X3): the branch image excludes **/dian/cloud/**
# at the build context layer (backend/.dockerignore). The
# parkos_core.dian.cloud module NEVER lands in this image.
#
# Required env (.env file in this directory):
#   PARKOS_SUCURSAL_UUID=<uuidv4 of the branch>
#   PARKOS_CLOUD_API_URL=https://cloud.example.com
#   PARKOS_DIAN_PROVIDER_URL=https://api.factus.example  # NOT used on branch but validated by env.py
#
# Run:
#   docker compose -f infra/deploy/docker-compose.branch.yml up -d
#   docker compose -f infra/deploy/docker-compose.branch.yml logs -f job_sync_sucursal
#
# First-boot pairing:
#   docker compose -f infra/deploy/docker-compose.branch.yml exec api-sucursal \
#     parkos-core pair --cloud-url "$PARKOS_CLOUD_API_URL" \
#     --admin-jwt "$PARKOS_ADMIN_JWT"
#
# Stop:
#   docker compose -f infra/deploy/docker-compose.branch.yml down

name: parkos-branch

services:
  # -------------------------------------------------------------------------
  # Postgres — pg_partman parent image (built locally; falls back to
  # the public postgres:16-alpine if the parkos image is missing).
  # -------------------------------------------------------------------------
  branch-db:
    image: parkos-postgres:16-pgpartman
    container_name: parkos-branch-db
    restart: unless-stopped
    environment:
      # Superuser of this node. The `migrate` service below connects with
      # the same pair, so both read the same variables (dev defaults only;
      # override both via env / .env for a real deployment).
      POSTGRES_USER: ${PARKOS_DB_SUPER_USER:-parkos}
      POSTGRES_PASSWORD: ${PARKOS_DB_SUPER_PASSWORD:-parkos}
      POSTGRES_DB: parkos
    volumes:
      - branch-db-data:/var/lib/postgresql/data
    networks:
      - parkos-branch-net
    ports:
      - "5433:5432"  # host 5433 → container 5432 to avoid clash with cloud on same host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # migrate — one-shot `alembic upgrade head` BEFORE any app service starts.
  #
  # Every long-running service overrides the Dockerfile ENTRYPOINT/CMD with
  # its own `command:`, so nothing else ever runs alembic. This service does
  # it once per `up`:
  #   - Same image as api-sucursal (venv + alembic.ini + migrations ship in
  #     it). Built from the same Dockerfile target, so layers are cached.
  #   - Connects as the Postgres SUPERUSER: the app login role has no CREATE
  #     on schema `prod` (InsufficientPrivilege). The superuser credentials
  #     live ONLY in this service; the apps keep their own DB credentials.
  #   - alembic is idempotent: at head it is a no-op. There is exactly one
  #     `migrate` per node and job-sync-sucursal runs a single replica, so
  #     there are no concurrent upgrades from this stack.
  #   - restart "no": it exits 0 on success. If it fails, api-sucursal and
  #     job-sync-sucursal never start (service_completed_successfully) and
  #     the error is in `docker compose -f <this file> logs migrate`.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.branch
      args:
        BUILD_TARGET: api_sucursal
    image: parkos:api-sucursal-test
    restart: "no"
    working_dir: /app/backend/packages/parkos_core
    command: ["/app/backend/.venv/bin/alembic", "upgrade", "head"]
    environment:
      PARKOS_DEPLOY: branch
      DATABASE_URL: postgresql+psycopg2://${PARKOS_DB_SUPER_USER:-parkos}:${PARKOS_DB_SUPER_PASSWORD:-parkos}@branch-db:5432/parkos
      # Read by migration 0021 to set the password of the app login role.
      PARKOS_APP_DB_PASSWORD: ${PARKOS_APP_DB_PASSWORD:-parkos_app_dev}
    depends_on:
      branch-db:
        condition: service_healthy
    networks:
      - parkos-branch-net

  # -------------------------------------------------------------------------
  # api-sucursal — the FastAPI branch API. Same multi-stage image as
  # the worker; SERVICE_NAME selects the entrypoint at boot.
  # -------------------------------------------------------------------------
  api-sucursal:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.branch
      args:
        BUILD_TARGET: api_sucursal
    image: parkos:api-sucursal-test
    container_name: parkos-api-sucursal
    restart: unless-stopped
    environment:
      PARKOS_DEPLOY: branch
      # T-PR11-007 (REQ-CUT-001, D22): default catalog_branch for branches
      # after stage 4 — override locally (e.g. `PARKOS_SYNC_ENGINE=legacy
      # docker compose -f infra/deploy/docker-compose.branch.yml up`) to
      # test the legacy path. Never inlines a real deploy value.
      PARKOS_SYNC_ENGINE: ${PARKOS_SYNC_ENGINE:-catalog_branch}
      PARKOS_SUCURSAL_UUID: ${PARKOS_SUCURSAL_UUID:?PARKOS_SUCURSAL_UUID required}
      PARKOS_DB_URL: postgresql+psycopg://${PARKOS_DB_SUPER_USER:-parkos}:${PARKOS_DB_SUPER_PASSWORD:-parkos}@branch-db:5432/parkos
      DATABASE_URL: postgresql+asyncpg://${PARKOS_DB_SUPER_USER:-parkos}:${PARKOS_DB_SUPER_PASSWORD:-parkos}@branch-db:5432/parkos
      PARKOS_CLOUD_API_URL: ${PARKOS_CLOUD_API_URL:?PARKOS_CLOUD_API_URL required}
      PARKOS_JWT_KEY_PATH: /var/run/parkos/jwt_private.pem
      PARKOS_SYNC_JWT_PATH: /var/run/parkos/sync.jwt
    depends_on:
      branch-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - parkos-branch-net
    ports:
      # host 8100 -> container 8000. The cloud api-admin already owns host
      # 8000 (web_admin proxies to :8000), and electron-sucursal's Vite
      # proxy targets http://localhost:8100. Publishing 8000 here collided
      # with api-admin and made `compose up` fail to program the endpoint.
      - "8100:8000"
    volumes:
      - jwt-volume:/var/run/parkos
    command: ["python", "-m", "uvicorn", "parkos_core.api.app_factory:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/openapi.json', timeout=4)\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # job_sync_sucursal — PR9b's new worker. Reads the sync-agent JWT
  # from the same named volume that the API writes it to on first
  # boot (after the admin pairs the branch).
  # -------------------------------------------------------------------------
  job-sync-sucursal:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.branch
      args:
        BUILD_TARGET: job_sync_sucursal
    image: parkos:job-sync-sucursal-test
    container_name: parkos-job-sync-sucursal
    restart: unless-stopped
    environment:
      PARKOS_DEPLOY: branch
      # T-PR11-007 (REQ-CUT-001, D22): default catalog_branch for branches
      # after stage 4 — see api-sucursal's identical env var above.
      PARKOS_SYNC_ENGINE: ${PARKOS_SYNC_ENGINE:-catalog_branch}
      PARKOS_SUCURSAL_UUID: ${PARKOS_SUCURSAL_UUID:?PARKOS_SUCURSAL_UUID required}
      PARKOS_DB_URL: postgresql+psycopg://${PARKOS_DB_SUPER_USER:-parkos}:${PARKOS_DB_SUPER_PASSWORD:-parkos}@branch-db:5432/parkos
      DATABASE_URL: postgresql+asyncpg://${PARKOS_DB_SUPER_USER:-parkos}:${PARKOS_DB_SUPER_PASSWORD:-parkos}@branch-db:5432/parkos
      PARKOS_CLOUD_API_URL: ${PARKOS_CLOUD_API_URL:?PARKOS_CLOUD_API_URL required}
      PARKOS_JWT_KEY_PATH: /var/run/parkos/jwt_private.pem
      PARKOS_SYNC_JWT_PATH: /var/run/parkos/sync.jwt
      PARKOS_SYNC_POLL_INTERVAL_S: "10"
      PARKOS_SYNC_BATCH_SIZE: "100"
    depends_on:
      branch-db:
        condition: service_healthy
      api-sucursal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - parkos-branch-net
    volumes:
      - jwt-volume:/var/run/parkos
    deploy:
      replicas: 1

networks:
  parkos-branch-net:
    driver: bridge

volumes:
  branch-db-data:
  jwt-volume:
