# nginx.conf — apps/web_admin production container (HU-F13.7, BR1 + BR2).
#
# Dropped in as `/etc/nginx/conf.d/default.conf` on top of the stock
# `nginx:alpine` image, which keeps that image's own `/etc/nginx/nginx.conf`
# (and its `user nginx;` / worker privilege-drop) untouched.
#
# BR1: serves the static `vite build` output — this is a client-only PWA,
# no SSR, so a single `location /` with an SPA fallback is enough.
#
# BR2: production equivalent of `vite.config.ts`'s dev-only
# `server.proxy['/api']` (`target: 'http://localhost:8000'`). In this
# container `localhost` would be the Nginx process itself, not the API —
# `api-admin` is the Docker Compose / orchestrator SERVICE NAME the admin
# API is reachable at (same naming convention as
# `infra/deploy/docker-compose.cloud.yml`'s `api-admin` service, port 8000).
# `proxy_pass` carries no path segment after the host:port on purpose, so
# the full `/api/...` request URI is forwarded unchanged — matching the
# dev proxy's un-rewritten behavior.
#
# `api-admin` is resolved through a `$variable` + explicit `resolver`
# (Docker's embedded DNS at 127.0.0.11 on any user-defined bridge network)
# instead of a bare hostname in `proxy_pass`. A bare hostname is resolved
# ONCE, at config-load time; if `api-admin` isn't resolvable yet (container
# not started standalone, e.g. this image's own CI smoke test, or a compose
# boot-order race), nginx refuses to start AT ALL — crash-looping `/`, the
# healthcheck target, right along with `/api/`. The variable form defers
# resolution to request time, so `/` keeps serving 200s even while `/api/`
# alone would 502 until `api-admin` exists.
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_admin_upstream api-admin;
        proxy_pass http://$api_admin_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived caching for Vite's content-hashed static assets.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routing (react-router-dom); also doubles
    # as the container HEALTHCHECK target (`GET /` -> 200, see Dockerfile).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
}
