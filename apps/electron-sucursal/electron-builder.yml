appId: co.parkos.electron-sucursal
productName: Parkos Sucursal
copyright: Copyright © 2026 Parkos
directories:
  output: dist/electron
  buildResources: build
files:
  - out/**/*
  - dist/renderer/**/*
  - package.json
extraMetadata:
  main: out/main.js
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Windows Authenticode via electron-builder auto-sign.
  # certificate file: process.env.WINDOWS_CERT_FILE (build pipeline concern).

# F2.3 enables auto-update via electron-updater (DEC-UPD-01..04).
autoUpdate: true
publish:
  - provider: github
    owner: easypunto_parkos
    repo: easypunto_parkos
    releaseType: release
    allowPrerelease: false

# F5.1 — T1.5 housekeeping: consolidated the two pre-existing `mac:`
# blocks (target/icon/category + hardenedRuntime) into ONE block,
# added `entitlements` + `entitlementsInherit` referencing the USB
# entitlement plist so hardenedRuntime can talk to libusb.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.business
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Office
  artifactName: "${productName}-${version}.${ext}"