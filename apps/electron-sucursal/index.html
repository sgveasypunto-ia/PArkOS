<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e85f24" />
    <meta
      name="description"
      content="Parkos Sucursal — desktop client"
    />
    <title>Parkos Sucursal</title>
    <!--
      Theme anti-flash (Fase 2+3). Debe ser un script SIN type="module",
      inline y ubicado en <head> para correr de forma síncrona antes de
      que se pinte cualquier cosa — así evita el "flash" de tema
      incorrecto (ej.: usuario prefiere oscuro, pero se ve claro por un
      instante hasta que React monta).

      Duplica a propósito la lógica mínima de
      `src/renderer/lib/theme.ts` (misma clave de localStorage, mismo
      criterio de resolución) porque no puede depender de un bundle JS
      en este punto. Si cambia la clave o el criterio allá, actualizar
      también acá.
    -->
    <script>
      (function () {
        var KEY = 'parkos.sucursal.theme';
        var pref = 'system';
        try {
          var stored = window.localStorage.getItem(KEY);
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            pref = stored;
          }
        } catch (e) {
          // localStorage no disponible (modo privado, cuota) — sigue con 'system'.
        }
        var resolved = pref;
        if (pref === 'system') {
          resolved =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        var root = document.documentElement;
        root.classList.add(resolved);
        root.setAttribute('data-theme', resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
